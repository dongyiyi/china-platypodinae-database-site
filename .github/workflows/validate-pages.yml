name: Validate Platypodinae five-page release
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend module syntax
        run: |
          for f in assets/platypodinae.js assets/contribute-page.js assets/cite-page.js assets/methods-page.js; do
            node --input-type=module --check < "$f"
          done
      - name: Validate provisional scope, nav, data and placeholders
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          html=Path('index.html').read_text()
          js=Path('assets/platypodinae.js').read_text()
          about=json.loads(Path('data/about.json').read_text())
          meta=json.loads(Path('data/site-meta.json').read_text())
          assert [meta['provisional_species_count'],meta['provisional_genera_count'],meta['provisional_tribes_count']]==[74,9,3]
          assert meta['published_profile_count']==1 and meta['profile_data_release_approved'] is False
          assert meta['pilot_profile_id']=='PLT_000062'
          pilot=json.loads(Path('data/species/PLT_000062.json').read_text())
          index=json.loads(Path('data/taxa.json').read_text())
          assert [r['plt'] for r in index]==['PLT_000062'] and pilot['plt']=='PLT_000062'
          assert pilot['checklist_status']=='Unreviewed' and pilot['china_occurrence']['Mainland China']=='Candidate'
          assert set(pilot['distribution']['reference_ids'])=={'lai2020'}
          refs={r['id'] for r in pilot['references']}
          assert all(id in refs for id in pilot['taxonomy_reference_ids'])
          assert all(id in refs for h in pilot['hosts'] for id in h['reference_ids'])
          assert [int(x['year']) for x in pilot['taxonomic_history']]==sorted([int(x['year']) for x in pilot['taxonomic_history']],reverse=True)
          assert all('#/'+r in html for r in ['browse','data','methods','contribute','cite','about'])
          assert all("'/"+r+"'" in js for r in ['data','methods','contribute','cite','about'])
          assert 'All subfamilies' in html and 'Explore Scolytinae' in html
          assert 'assets/platypodinae.js?v=20261027-2' in html
          assert 'href="assets/site.css?v=20261027-1"' in html
          assert [p.parent.name for p in Path('.').glob('taxa/PLT_*/index.html')]==['PLT_000062']
          page=Path('taxa/PLT_000062/index.html').read_text()
          assert 'assets/platypodinae-profile.js?v=20261028-1' in page
          jsprofile=Path('assets/platypodinae-profile.js').read_text()
          assert 'sortTaxonomicHistory' in jsprofile and 'data-ref-jump' in jsprofile
          assert 'grid profile-content' in jsprofile and 'resource-tab' in jsprofile
          assert [int(x['year']) for x in pilot['taxonomic_history']]==[2020,1972]
          assert 'PLT_000062' in page and 'id="app"' in page
          assert all('ref-'+r in jsprofile or "'ref-'" in jsprofile for r in refs)
          assert 'data/taxa.json' not in html or 'PLT_000062' in html
          files=['assets/contribute-page.js','assets/cite-page.js','assets/methods-page.js']
          for p in files:
            data=Path(p).read_text()
            assert 'VSN' not in data
            assert 'Chinese Scolytinae' not in data
          assert 'mailto:' in Path('assets/contribute-page.js').read_text()
          assert not 'app.notion.com/p/0ca21aa2d32840b29a2cb93cffa03870' in Path('assets/contribute-page.js').read_text()
          assert len(about['sections'])>=4
          assert 'VSN' not in json.dumps(about)
          assert 'Existing PLT' in Path('assets/templates/china_platypodinae_public_submission_template.csv').read_text()
          print('PASS: provisional 74 taxa, exactly one public PLT_000062 pilot, candidate retained, citations & chronological history')
          PY
