name: Validate Platypodinae five-page release
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend module syntax
        run: |
          for f in assets/platypodinae.js assets/platypodinae-profile.js assets/contribute-page.js assets/cite-page.js assets/methods-page.js; do
            node --input-type=module --check < "$f"
          done
      - name: Validate provisional scope, nav, data and placeholders
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          html=Path('index.html').read_text()
          js=Path('assets/platypodinae.js').read_text()
          about=json.loads(Path('data/about.json').read_text())
          meta=json.loads(Path('data/site-meta.json').read_text())
          assert [meta['provisional_species_count'],meta['provisional_genera_count'],meta['provisional_tribes_count']]==[74,9,3]
          assert meta['published_profile_count']==18 and meta['profile_data_release_approved'] is False
          assert meta['pilot_profile_id']=='PLT_000062'
          pilot=json.loads(Path('data/species/PLT_000062.json').read_text())
          index=json.loads(Path('data/taxa.json').read_text())
          assert [r['plt'] for r in index]==sorted([r['plt'] for r in index])
          assert set(r['plt'] for r in index)==set('PLT_'+str(i).zfill(6) for i in [1,2,3,4,5,6,7,9,10,12,13,14,15,16,17,19,20,62]) and pilot['plt']=='PLT_000062'
          assert all(json.loads(Path('data/species/'+r['plt']+'.json').read_text())['checklist_status']=='Unreviewed' for r in index)
          for entry in index:
            p=json.loads(Path('data/species/'+entry['plt']+'.json').read_text())
            refs={r['id'] for r in p['references']}
            assert all(x in refs for x in p['distribution'].get('reference_ids',[]))
            regions=p['distribution'].get('claims',[])
            assert len(regions)==len(set(c['region'] for c in regions))
            assert all(c.get('reference_ids') for c in regions)
            assert all(x in refs for c in regions for x in c['reference_ids'])
            assert p['distribution'].get('review_status')=='Accepted'
            assert p.get('host_review_status')=='Accepted'
            assert len(p.get('hosts',[]))==len(set(h['scientific_name'].lower() for h in p.get('hosts',[])))
            assert all(x in refs for h in p['hosts'] for x in h.get('reference_ids',[]))
            assert all(x in refs for h in p['taxonomic_history'] for x in h.get('reference_ids',[]))
            years=[int(x['year']) for x in p['taxonomic_history']]
            assert years==sorted(years,reverse=True)
          assert pilot['checklist_status']=='Unreviewed' and pilot['china_occurrence']['Mainland China']=='Present'
          assert set(pilot['distribution']['reference_ids'])=={'lai2020'}
          refs={r['id'] for r in pilot['references']}
          assert all(id in refs for id in pilot['taxonomy_reference_ids'])
          assert all(id in refs for h in pilot['hosts'] for id in h['reference_ids'])
          assert [int(x['year']) for x in pilot['taxonomic_history']]==sorted([int(x['year']) for x in pilot['taxonomic_history']],reverse=True)
          assert all('#/'+r in html for r in ['browse','data','methods','contribute','cite','about'])
          assert all("'/"+r+"'" in js for r in ['data','methods','contribute','cite','about'])
          assert 'All subfamilies' in html and 'Explore Scolytinae' in html
          assert 'assets/platypodinae.js?v=20261027-2' in html
          assert 'href="assets/site.css?v=20261027-1"' in html
          assert set(p.parent.name for p in Path('.').glob('taxa/PLT_*/index.html'))==set(r['plt'] for r in index)
          page=Path('taxa/PLT_000062/index.html').read_text()
          assert 'assets/platypodinae-profile.js?v=20261028-2' in page
          jsprofile=Path('assets/platypodinae-profile.js').read_text()
          assert 'sortTaxonomicHistory' in jsprofile and 'data-ref-jump' in jsprofile and 'host-ref-placeholder' in jsprofile and 'claim-ref-placeholder' in jsprofile
          assert 'grid profile-content' in jsprofile and 'resource-tab' in jsprofile
          assert [int(x['year']) for x in pilot['taxonomic_history']]==[2020,1972]
          assert 'PLT_000062' in page and 'id="app"' in page
          assert all('ref-'+r in jsprofile or "'ref-'" in jsprofile for r in refs)
          assert 'data/taxa.json' not in html or 'PLT_000062' in html
          files=['assets/contribute-page.js','assets/cite-page.js','assets/methods-page.js']
          for p in files:
            data=Path(p).read_text()
            assert 'VSN' not in data
            assert 'Chinese Scolytinae' not in data
          assert 'mailto:' in Path('assets/contribute-page.js').read_text()
          assert not 'app.notion.com/p/0ca21aa2d32840b29a2cb93cffa03870' in Path('assets/contribute-page.js').read_text()
          assert len(about['sections'])>=4
          assert 'VSN' not in json.dumps(about)
          assert 'Existing PLT' in Path('assets/templates/china_platypodinae_public_submission_template.csv').read_text()
          print('PASS: 18 published profiles, 000008 excluded, accepted merged distribution/hosts with complete citations, taxonomy separated')
          PY
